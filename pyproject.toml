[build-system]
requires = ["setuptools>=68.0,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tqwebhelper2"
version = "0.1.1"
description = "天勤量化 Web UI 增强版 — 替换 tqsdk 默认 Web 界面，无需修改官方 SDK"
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "pseudocodes" }]
keywords = ["tqsdk", "quantitative", "trading", "web-ui", "futures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["tqsdk>=3.0.0"]

[project.urls]
Homepage = "https://github.com/pseudocodes/tqwebhelper2"
Repository = "https://github.com/pseudocodes/tqwebhelper2"
Issues = "https://github.com/pseudocodes/tqwebhelper2/issues"

[tool.setuptools.packages.find]
include = ["tqwebhelper2*"]

[tool.setuptools.package-data]
tqwebhelper2 = ["web/**/*"]
